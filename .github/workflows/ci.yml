name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed (package-lock.json is gitignored), so use
      # `npm install`.
      - name: Install
        run: npm install

      - name: Typecheck (core + web, strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Rebuild the committed bundle from source and fail if it drifts. The app
      # ships index.html + assets/ (the Vite build promoted to the repo root by
      # scripts/promote-build.mjs) so it runs with zero install. If a source
      # change didn't have `npm run build` run + committed, the rebuild below
      # produces different output than what's committed — fail loudly so a stale
      # bundle never reaches a deploy (GitHub Pages serves the root verbatim).
      - name: Rebuild committed bundle from source
        run: npm run build

      - name: Verify committed bundle is in sync with sources
        run: |
          if ! git diff --exit-code -- index.html assets/; then
            echo "::error::index.html / assets/ are out of sync with source. Run 'npm run build' and commit the result."
            exit 1
          fi
